<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.4" />
    </pattern>

    <!-- Filter for soft neon glow -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .code-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .sans-font { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; }
    
    /* Subtle Dynamic Animations in background */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.7; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateY(420px); opacity: 0; }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -100; }
    }
    @keyframes pulseBadge {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px rgba(129, 140, 248, 0.8)); }
    }

    .pulsing-orb-1 { transform-origin: 300px 180px; animation: pulseOrb 10s ease-in-out infinite; }
    .pulsing-orb-2 { transform-origin: 900px 240px; animation: pulseOrb 12s ease-in-out infinite reverse; }
    .float-p1 { animation: floatParticle 6s ease-in-out infinite; }
    .float-p2 { animation: floatParticle 8s ease-in-out infinite 2s; }
    .float-p3 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .scanner { animation: scanLine 8s linear infinite; }
    .dashed-wire { stroke-dasharray: 6 6; animation: dashCycle 8s linear infinite; }
    .live-badge { animation: pulseBadge 3s ease-in-out infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background Animated Glowing Orbs (Strictly behind text) -->
  <g class="pulsing-orb-1">
    <circle cx="280" cy="180" r="240" fill="url(#orbGlow)" />
  </g>
  <g class="pulsing-orb-2">
    <circle cx="920" cy="220" r="280" fill="url(#orbGlow)" />
  </g>

  <!-- Technical Cyber Grid Overlay -->
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Animated Background Network Graph Connections (Behind Content) -->
  <g opacity="0.35">
    <path class="dashed-wire" d="M 120 100 L 260 60 L 400 130 L 600 70 L 800 140 L 980 90 L 1100 160" fill="none" stroke="#60a5fa" stroke-width="1.5" />
    <path class="dashed-wire" d="M 80 320 L 240 360 L 450 300 L 720 370 L 960 320 L 1120 350" fill="none" stroke="#c084fc" stroke-width="1.5" />
    
    <!-- Background Floating Nodes -->
    <circle class="float-p1" cx="260" cy="60" r="4" fill="#38bdf8" />
    <circle class="float-p2" cx="600" cy="70" r="5" fill="#818cf8" />
    <circle class="float-p3" cx="980" cy="90" r="4" fill="#c084fc" />
    <circle class="float-p2" cx="240" cy="360" r="4" fill="#38bdf8" />
    <circle class="float-p1" cx="720" cy="370" r="5" fill="#a855f7" />
  </g>

  <!-- Subtle Horizontal Scan Line -->
  <line class="scanner" x1="0" y1="0" x2="1200" y2="0" stroke="url(#primaryGlow)" stroke-width="1" opacity="0.4" />

  <!-- FOREGROUND CONTENT: Guaranteed high contrast and readability -->
  
  <!-- Category Pill Badge -->
  <g transform="translate(600, 75)">
    <g class="live-badge" transform="translate(-175, -16)">
      <rect width="350" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="20" cy="16" r="5" fill="#10b981" />
      <text class="code-font" x="34" y="21" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">CURATED KNOWLEDGE BASE • 2026</text>
    </g>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(600, 155)">
    <text class="sans-font" x="0" y="0" text-anchor="middle" font-size="44" font-weight="800" fill="url(#primaryGlow)" letter-spacing="-1">
      Autonomous AI Developer Agents
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(600, 205)">
    <text class="sans-font" x="0" y="0" text-anchor="middle" font-size="19" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Self-Directed Engineering Agents • Sandboxed Runtimes • MCP Tools • Coding Benchmarks
    </text>
  </g>

  <!-- Tech Feature Pills Row (Centered, Crisp, Non-intrusive) -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: OpenHands -->
    <g transform="translate(-460, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="code-font" x="67" y="21" text-anchor="middle" font-size="12" fill="#93c5fd" font-weight="600">🤖 OpenHands</text>
    </g>
    <!-- Pill 2: Devin -->
    <g transform="translate(-305, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="code-font" x="67" y="21" text-anchor="middle" font-size="12" fill="#a5b4fc" font-weight="600">⚡ Devin (AI)</text>
    </g>
    <!-- Pill 3: Goose -->
    <g transform="translate(-150, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="code-font" x="67" y="21" text-anchor="middle" font-size="12" fill="#d8b4fe" font-weight="600">🪿 Goose Agent</text>
    </g>
    <!-- Pill 4: Cline -->
    <g transform="translate(5, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="code-font" x="67" y="21" text-anchor="middle" font-size="12" fill="#f472b6" font-weight="600">💻 Cline / Roo</text>
    </g>
    <!-- Pill 5: SWE-agent -->
    <g transform="translate(160, 0)">
      <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="code-font" x="72" y="21" text-anchor="middle" font-size="12" fill="#38bdf8" font-weight="600">🔬 SWE-agent</text>
    </g>
    <!-- Pill 6: MCP Servers -->
    <g transform="translate(325, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text class="code-font" x="67" y="21" text-anchor="middle" font-size="12" fill="#34d399" font-weight="600">🔌 MCP Protocol</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(600, 345)">
    <rect x="-420" y="0" width="840" height="42" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.2" />
    <circle cx="-395" cy="21" r="5" fill="#ef4444" />
    <circle cx="-380" cy="21" r="5" fill="#f59e0b" />
    <circle cx="-365" cy="21" r="5" fill="#10b981" />
    <text class="code-font" x="-340" y="26" font-size="13" fill="#64748b">$ git clone &amp;&amp; autonomous-agent --mode=swe-bench --sandbox=docker --auto-verify</text>
  </g>
</svg>